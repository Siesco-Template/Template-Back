name: Publish ImportExportComponent NuGet Package

on:
  push:
    branches:
      - main
      - deploy
    paths:
      - 'ImportExportComponent/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.2)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ImportExportComponent/ImportExportComponent.csproj

      - name: Build
        run: dotnet build ImportExportComponent/ImportExportComponent.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ImportExportComponent/ImportExportComponent.csproj --configuration Release --no-build --output ./nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://nuget.pkg.github.com/Siesco-Template/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

