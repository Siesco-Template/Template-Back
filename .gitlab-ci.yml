
stages:
  - build
  - deploy
variables: 
  DOCKER_HOST: "unix:///var/run/docker.sock"
build-job:
  stage: build
  tags: 
    - template
  image: docker:20.10.24
  script:
    - echo " Docker image build edilir..."
    - docker compose build    
deploy-job:
  stage: deploy
  tags:
    - template
  image: docker:20.10.24
  only:
    - deploy   
  script:
    - echo " Deploy edilir..."
    - docker compose up -d --build