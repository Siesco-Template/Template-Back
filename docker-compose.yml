version: '3.8'

services:
  gateway:
    container_name: template-gateway-gitlab
    build:
      context: .
      dockerfile: Gateway/Template.Gateway/Dockerfile
    ports:
      - "6031:8080"
    depends_on:
      - auth
      - permission
      - main
    restart: always
    networks:
      - public-network

  main:
    container_name: template-main-service-gitlab
    build:
      context: .
      dockerfile: Main/MainProject.API/Dockerfile
    ports:
      - "6034:8080"
    volumes:
      # ✅ Yol düzəldildi: nisbətən konteynerdəki /app/wwwroot doğru olsun deyə absolute path istifadə edilməlidir.
      - ./Main/MainProject.API/wwwroot:/app/wwwroot
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - public-network

  auth:
    container_name: template-auth-service-gitlab
    build:
      context: .
      dockerfile: Authentication/Auth.API/Dockerfile
    ports:
      - "6032:8080"
    restart: always
    networks:
      - public-network      

  permission:
    container_name: template-permission-service-gitlab
    build:
      context: .
      dockerfile: Permission/Permission.Api/Dockerfile
    ports:
      - "6033:8080"
    restart: always
    networks:
      - public-network

networks:
  public-network:
    external: true
